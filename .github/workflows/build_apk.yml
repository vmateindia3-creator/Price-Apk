name: Build Android Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Android Platform Code
        run: |
          rm -rf android
          flutter create --platforms=android --org com.example.priceapk .

      - name: Inject minSdkVersion 21
        run: |
          python3 -c "
          import os
          path = 'android/app/build.gradle'
          if os.path.exists(path):
              with open(path, 'r') as f:
                  content = f.read()
              content = content.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 21')
              content = content.replace('minSdkVersion 19', 'minSdkVersion 21')
              with open(path, 'w') as f:
                  f.write(content)
          else:
              print('Warning: build.gradle not found, skipping patch.')
          "

      - name: Restore Google Services Config
        run: |
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/
          fi

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          
