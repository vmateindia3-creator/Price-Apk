name: Build Android Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Complete Android Platform Structure
        run: |
          rm -rf android
          flutter create --platforms=android --org com.example .

      - name: Configure Minimum SDK 21
        run: |
          sed -i 's/minSdkVersion.*/minSdkVersion 21/' android/app/build.gradle

      - name: Restore Google Services Config
        run: |
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/
          fi

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          
