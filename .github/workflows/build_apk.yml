name: Build Android Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Rebuild Fresh Android Project Files
        run: |
          rm -rf android
          flutter create --platforms=android .

      - name: Force Fix minSdkVersion 21
        run: |
          python3 -c "
          path = 'android/app/build.gradle'
          with open(path, 'r') as f:
              content = f.read()
          if 'minSdkVersion' in content:
              lines = content.split('\n')
              for i, line in enumerate(lines):
                  if 'minSdkVersion' in line:
                      lines[i] = '        minSdkVersion 21'
              content = '\n'.join(lines)
          else:
              content = content.replace('defaultConfig {', 'defaultConfig {\n        minSdkVersion 21')
          with open(path, 'w') as f:
              f.write(content)
          "

      - name: Restore Google Services Config
        run: |
          if [ -f "android/app/google-services.json" ]; then
            echo "google-services.json already in android/app"
          elif [ -f "google-services.json" ]; then
            cp google-services.json android/app/
          fi

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          
